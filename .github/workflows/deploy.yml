name: Terbitkan Jelajah Ayat

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  terbitkan:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Ambil fail laman
        uses: actions/checkout@v6
      - name: Sediakan GitHub Pages
        uses: actions/configure-pages@v5
      - name: Muat naik fail laman
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Terbitkan laman
        id: deployment
        uses: actions/deploy-pages@v4
